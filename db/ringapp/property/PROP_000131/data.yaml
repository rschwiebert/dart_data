commutative_only: true
definition: A commutative ring is called catenary if for all prime ideals $p \subseteq q$,
  there exists an $n$ such that any chain of prime ideals between $p$ and $q$ can be refined
  to a maximal chain of prime ideals from $p$ to $q$ with length $n$.
name: catenary
symmetric: true
